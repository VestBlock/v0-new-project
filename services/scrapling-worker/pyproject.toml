[project]
name = "vestblock-scrapling-worker"
version = "0.1.0"
description = "Policy-enforced public-web research worker for Vestblock"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.35,<0.36",
  "scrapling[fetchers]>=0.4.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
